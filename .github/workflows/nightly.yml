name: Nightly

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  full-check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo build --release
      - if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Nightly CI failed'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = `The scheduled full check failed: ${runUrl}`
            const { data: issues } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', labels: 'nightly' })
            const existing = issues.find((i) => i.title === title)
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title, body, labels: ['nightly'] })
            }
