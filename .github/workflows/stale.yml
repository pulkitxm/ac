name: Stale

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.PUKBOT_CLIENT_ID }}
          private-key: ${{ secrets.PUKBOT_PRIVATE_KEY }}
          owner: pulkitxm
          repositories: ac
          permission-issues: write
          permission-pull-requests: write
      - uses: actions/stale@v9
        with:
          repo-token: ${{ steps.app-token.outputs.token }}
          days-before-stale: 45
          days-before-close: 14
          stale-issue-message: 'No activity in 45 days, closing in 14 more unless something happens here.'
          stale-pr-message: 'No activity in 45 days, closing in 14 more unless something happens here.'
          exempt-issue-labels: pinned,nightly
          exempt-pr-labels: pinned
