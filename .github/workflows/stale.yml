name: Stale

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 45
          days-before-close: 14
          stale-issue-message: 'No activity in 45 days, closing in 14 more unless something happens here.'
          stale-pr-message: 'No activity in 45 days, closing in 14 more unless something happens here.'
          exempt-issue-labels: pinned,nightly
          exempt-pr-labels: pinned
