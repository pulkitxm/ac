name: Link check

on:
  schedule:
    - cron: '45 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - '**/*.md'

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200..=206,429 README.md 'docs/**/*.md'
          fail: true
