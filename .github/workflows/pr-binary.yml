name: PR binary

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-binary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ac-pr-${{ github.event.pull_request.number }}
          path: target/release/ac
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const marker = '<!-- pr-binary -->'
            const mb = (fs.statSync('target/release/ac').size / 1024 / 1024).toFixed(1)
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const sha = context.payload.pull_request.head.sha.slice(0, 7)
            const body = [
              marker,
              `release binary from ${sha} is ${mb} MB, download from the [run artifacts](${runUrl})`,
            ].join('\n')
            const issue_number = context.payload.pull_request.number
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number })
            const existing = comments.find((c) => c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number, body })
            }
