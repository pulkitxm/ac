name: Security audit

on:
  schedule:
    - cron: '15 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          comment-summary-in-pr: on-failure
