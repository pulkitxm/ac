[package]
name = "ac-cli"
version = "0.3.3"
edition = "2021"
rust-version = "1.80"
description = "Apple Container project runner: a docker-compatible CLI and compose-style stack orchestrator for Apple container. macOS only."
license = "MIT"
readme = "README.md"
repository = "https://github.com/pulkitxm/ac"
homepage = "https://github.com/pulkitxm/ac"
documentation = "https://github.com/pulkitxm/ac/wiki"
keywords = ["container", "macos", "docker", "compose", "cli"]
categories = ["command-line-utilities", "development-tools", "virtualization"]
exclude = [".github/", "tests/", "projects/", "scripts/"]
default-run = "ac"

[[bin]]
name = "ac"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
ctrlc = "3"
indicatif = "0.17"
owo-colors = { version = "4", features = ["supports-colors"] }
serde = { version = "1", features = ["derive"] }
# preserve_order keeps manifest maps (env, buildArgs, labels) in the order the
# author wrote them, so the echoed `container` command matches the manifest.
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
